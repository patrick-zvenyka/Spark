{% extends "base.html" %}

{% block title %}Log out - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold text-slate-950">Log out</h1>
    <p class="mt-2 text-sm text-slate-600">Are you sure you want to end your current session?</p>

    <form method="post" class="mt-6 flex flex-wrap gap-3">
        {% csrf_token %}
        <button type="submit" class="rounded-md bg-red-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-800">
            Log out
        </button>
        <a href="{% url 'questions:board' %}" class="rounded-md border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-800 hover:bg-slate-50">
            Cancel
        </a>
    </form>
</section>
{% endblock %}
